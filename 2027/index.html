function getElim(){const e={};if(!dbSet.size)return e;dbSet.forEach(qid=>{const q=QQ.find(x=>x.id===qid),uv=ans[qid];if(!q||!uv||uv==='skip')return;CK.forEach(k=>{const cp=q.p[k];if((uv>0&&cp<0)||(uv<0&&cp>0)){if(!e[k])e[k]=[];e[k].push(q.t);}});});return e;}
function getDet(k){const ag=[],di=[];const vl={'-2':'−2 Totalement contre','-1':'−1 Plutôt contre','0':'0 Sans opinion','1':'+1 Plutôt pour','2':'+2 Totalement pour'};aQ.forEach(q=>{const u=ans[q.id],c=q.p[k];if(u===undefined||u==='skip'||u===0||c===null||c===0)return;const obj={id:q.id,t:q.t,uv:vl[String(u)],cp:vl[String(c)]};if((u>0&&c>0)||(u<0&&c<0))ag.push(obj);else di.push(obj);});return{ag,di};}
function compass(ux,uy){const cx=205,cy=165,xs=73,ys=65,cl=(v,a,b)=>Math.max(a,Math.min(b,v));const sl=dk?'#21262d':'#E4E1DC',dl=dk?'#30363d':'#EDEBE7',lb=dk?'#484f58':'#A8A29A',st=dk?'#e6edf3':'#1A1D21',sb=dk?'#161b22':'#ffffff';let dots='';CK.forEach(k=>{const d=CV[k];if(d.sx===null||d.sy===null)return;const dx=cx+d.sx*xs,dy=cy+d.sy*ys;dots+=`<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="7" fill="${d.c}" opacity="0.9"><title>${d.n}</title></circle>`;});const upx=cx+cl(ux,-1.9,1.9)*xs,upy=cy+cl(uy,-1.9,1.9)*ys;return`<svg width="100%" viewBox="0 0 410 330" style="display:block;max-width:410px;margin:0 auto"><rect x="${cx-146}" y="${cy-130}" width="146" height="130" fill="#A03A28" opacity="0.04"/><rect x="${cx}" y="${cy-130}" width="146" height="130" fill="#000091" opacity="0.04"/><rect x="${cx-146}" y="${cy}" width="146" height="130" fill="#b91c1c" opacity="0.05"/><rect x="${cx}" y="${cy}" width="146" height="130" fill="#1e3a8a" opacity="0.05"/><rect x="${cx-146}" y="${cy-130}" width="292" height="260" fill="none" stroke="${sl}" stroke-width="1"/><line x1="${cx-146}" y1="${cy}" x2="${cx+146}" y2="${cy}" stroke="${dl}" stroke-width=".5" stroke-dasharray="3,3"/><line x1="${cx}" y1="${cy-130}" x2="${cx}" y2="${cy+130}" stroke="${dl}" stroke-width=".5" stroke-dasharray="3,3"/><text x="${cx-140}" y="${cy-6}" style="font-size:9px;fill:${lb}">← Gauche éco.</text><text x="${cx+140}" y="${cy-6}" text-anchor="end" style="font-size:9px;fill:${lb}">Droite éco. →</text><text x="${cx+3}" y="${cy-118}" style="font-size:9px;fill:${lb}">↑ Progressiste</text><text x="${cx+3}" y="${cy+126}" style="font-size:9px;fill:${lb}">↓ Conservateur</text>${dots}<circle cx="${upx.toFixed(1)}" cy="${upy.toFixed(1)}" r="13" fill="${sb}" stroke="#000091" stroke-width="2.5"/><text x="${upx.toFixed(1)}" y="${(upy+5).toFixed(1)}" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#000091">★</text></svg>`;}
function codeBlock(){const answered=Object.keys(ans).filter(k=>ans[k]!=='skip');const rows=CK.map(k=>{let s=0,n=0;aQ.forEach(q=>{const v=ans[q.id];if(v!==undefined&&v!=='skip'&&q.p[k]!==null){s+=1-Math.abs(v-q.p[k])/4;n++;}});const pct=n?Math.round(s/n*100):0;const isE=mode==='filter'&&!!getElim()[k];return{k,s:s.toFixed(3),n,pct,isE};}).sort((a,b)=>b.pct-a.pct);const traceRows=rows.map(r=>{const filled=Math.round(r.pct/5);const bar=r.isE?'[ÉLIMINÉ]        ':'['+'█'.repeat(filled)+' '.repeat(20-filled)+']';const name=(CV[r.k].s).padEnd(12,' ');const eq=r.n?`&Sigma;=${r.s}&thinsp;/&thinsp;${r.n}&thinsp;=&thinsp;${(r.s/r.n).toFixed(3)}&thinsp;&times;&thinsp;100`:'aucune réponse';return`<div><span style="color:${r.isE?'#f87171':'#c9d1d9'}">${name}</span><span style="color:${r.isE?'#f87171':'#9be09a'}"> ${bar} <b>${String(r.pct).padStart(3)}%</b>  </span><span style="color:#5a7fa0">// ${eq}</span></div>`;}).join('');return`<div class="cbk"><div class="ck2"><span style="font-size:12px;font-weight:700;color:#79c0ff;text-transform:uppercase;letter-spacing:.07em">Algorithme &amp; exécution</span><a href="https://github.com/pourlafrance/Test-de-personnalite-politique" target="_blank" style="padding:5px 10px;background:#1a2236;border:.5px solid #2d4a7a;border-radius:0;color:#79c0ff;font-size:12px;text-decoration:none">↗ GitHub</a></div><div class="cb2"><div><span style="color:#c792ea">function</span> <span style="color:#82aaff">compute</span>() {</div><div>&nbsp;&nbsp;<span style="color:#c792ea">const</span> cm = {};  <span style="color:#5a7fa0">// cm = scores de compatibilité par candidat</span></div><div>&nbsp;&nbsp;CK.forEach(k =&gt; {  <span style="color:#5a7fa0">// pour chaque candidat k</span></div><div>&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:#c792ea">let</span> s = <span style="color:#f78c6c">0</span>, n = <span style="color:#f78c6c">0</span>;  <span style="color:#5a7fa0">// s = somme des scores, n = nb réponses</span></div><div>&nbsp;&nbsp;&nbsp;&nbsp;aQ.forEach(q =&gt; {  <span style="color:#5a7fa0">// pour chaque question</span></div><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:#c792ea">const</span> v = ans[q.id];  <span style="color:#5a7fa0">// vote de l'utilisateur</span></div><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:#c792ea">if</span> (v !== undefined &amp;&amp; v !== <span style="color:#c3e88d">'skip'</span> &amp;&amp; q.p[k] !== <span style="color:#f78c6c">null</span>) {  <span style="color:#5a7fa0">// skip et position non documentée exclus du calcul</span></div><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;s += <span style="color:#f78c6c">1</span> - Math.abs(v - q.p[k]) / <span style="color:#f78c6c">4</span>;  <span style="color:#5a7fa0">// 1 − |vote − position| / 4</span></div><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;n++;  <span style="color:#5a7fa0">// vote ∈ {−2, −1, 0, +1, +2} → écart max = 4</span></div><div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;}</div><div>&nbsp;&nbsp;&nbsp;&nbsp;});</div><div>&nbsp;&nbsp;&nbsp;&nbsp;cm[k] = n ? Math.round(s / n * <span style="color:#f78c6c">100</span>) : <span style="color:#f78c6c">null</span>;  <span style="color:#5a7fa0">// moyenne → arrondi en %</span></div><div>&nbsp;&nbsp;});</div><div>&nbsp;&nbsp;<span style="color:#c792ea">return</span> cm;</div><div>}</div><div style="margin-top:10px;padding-top:8px;border-top:.5px solid #21262d"><span style="color:#5a7fa0">// Exécution &middot; Q${ci+1}/${aQ.length} &middot; ${answered.length} réponse${answered.length>1?'s':''} &middot; toutes les questions ont le même poids</span></div>${traceRows}</div></div>`;}

function civic(){return`<div class="cv"><div style="font-size:16px;font-weight:700;color:var(--t1);margin-bottom:12px"> Voter est un devoir civique, et un devoir de se renseigner soi-même</div><p class="bm" style="margin-bottom:11px">Dans une démocratie, votre opinion vous appartient. Mais elle se construit, elle ne s'impose pas.</p><p class="bm" style="margin-bottom:11px">Recevoir une information de manière orientée (via un réseau social, un média partial, ou même un proche convaincu) influence votre avis <em>avant même que vous ayez eu le temps de le former vous-même</em>. C'est un phénomène documenté en psychologie : la première version d'un fait que nous entendons colore durablement notre jugement. L'amorçage cognitif et les biais de confirmation font le reste.</p><p class="bm" style="margin-bottom:11px">Ce test présente chaque position de manière équilibrée, sans jugement et sans orientation. Il ne vous dit pas pour qui voter. Il vous aide à <strong>comprendre les programmes</strong> et à identifier vos propres convictions.</p><p class="bm" style="margin-bottom:11px">La République française repose sur des valeurs fondamentales : <strong>Liberté, Égalité, Fraternité</strong>. La démocratie représentative n'a de sens que si chacun participe. <strong>S'abstenir, c'est laisser les autres décider à votre place.</strong> Voter sans se renseigner, c'est déléguer son jugement à ceux qui ont parlé le plus fort.</p><p class="bm">Ce test est un premier pas. Lisez plusieurs sources, confrontez les arguments, questionnez les certitudes. Le travail de citoyen commence avant le bureau de vote.</p></div>`;}

  const isFlt=mode==='filter';
  const nb=aQ.length;
  const ncands=Object.keys(CV).length;
  return`<div id="avant" style="margin-top:26px;padding-top:22px;border-top:1px solid var(--cb)">
<div class="lb" style="margin-bottom:12px">${modeLabel.toUpperCase()} · ${nb} QUESTION${nb>1?'S':''}</div>

    <div style="display:flex;align-items:flex-start;gap:10px"><span style="font-size:12px;font-weight:700;color:var(--t3);width:175px;flex-shrink:0">Sans opinion</span><span class="bm">Vous n'avez pas d'avis tranché sur ce sujet.</span></div>

    <div style="display:flex;align-items:flex-start;gap:10px"><span style="font-size:12px;font-weight:700;color:var(--gk);width:175px;flex-shrink:0">Totalement d'accord</span><span class="bm">Vous êtes fermement pour cette proposition.</span></div>
  </div>
</div>
<div style="background:var(--wg);border:1px solid var(--wb);border-radius:0;padding:14px 16px;margin-bottom:12px">

  <p style="font-size:13.5px;line-height:1.7;color:var(--wt);margin:0">Répondre "sans opinion" assigne la valeur <strong>0</strong> à votre vote, ce qui tire le score vers <strong>50 %</strong> sur cette question, atténuant les différences entre candidats. Si vous ne connaissez pas un sujet, utilisez <strong>Je ne connais pas ce sujet</strong> : la question sera totalement exclue du calcul, sans biaiser le résultat.</p>
</div>
${isFlt?`<div style="background:var(--rg);border:1px solid var(--rb);border-radius:0;padding:14px 16px;margin-bottom:12px">

</div>`:''}
<div class="card" style="margin-bottom:20px">

<p style="font-size:13.5px;line-height:1.7;color:var(--t2);margin:0 0 10px">Candidatures déclarées, mais moins de 15 positions documentées à ce jour : Nathalie Arthaud (Lutte ouvrière), François Asselineau (UPR), Delphine Batho (Génération écologie), Olivier Becht, Karim Bouamrane (PS), Clara Egger (Solution démocratique), Anasse Kazib (Révolution permanente), Selma Labib (NPA-Révolutionnaires), Francis Lalanne (France Libre), Antoine Mikolajczak (Équinoxe), Fabien Roussel (PCF). Ils seront intégrés dès que leurs positions seront documentées. Le détail de la recherche est publié dans le dépôt du projet (dossier <code>2027/sources</code>).</p>

<p style="font-size:13.5px;line-height:1.7;color:var(--t2);margin:0 0 10px">Xavier Bertrand a répondu « Je le serai » le 27 août 2026 mais, selon son entourage, ce n'est pas une annonce officielle ; il a indiqué vouloir se déclarer « à la fin de l'année » (<a href="https://lcp.fr/actualites/2027-figure-de-la-droite-xavier-bertrand-confirme-qu-il-sera-candidat-a-l-election" target="_blank" rel="noopener" style="color:var(--pri);text-decoration:underline">LCP</a>). Jordan Bardella ne figure pas dans les listes de candidats déclarés ; Éric Ciotti a proposé à Marine Le Pen un pacte d'alliance pour 2027 (<a href="https://www.franceinfo.fr/politique/il-n-y-a-qu-une-voie-eric-ciotti-propose-a-marine-le-pen-un-pacte-d-alliance-pour-la-presidentielle-de-2027_8178815.html" target="_blank" rel="noopener" style="color:var(--pri);text-decoration:underline">franceinfo</a>) et n'est pas candidat.</p>
<div style="font-size:13px;font-weight:700;color:var(--t1);margin:16px 0 6px">Primaires en cours</div>
<p style="font-size:13.5px;line-height:1.7;color:var(--t2);margin:0 0 10px">Les participants aux primaires de gauche prévues en octobre 2026 (dont Marine Tondelier, François Ruffin, Raphaël Glucksmann, Olivier Faure) n'ont pas encore de candidature à la présidentielle définitive : ils seront évalués selon la même règle une fois les résultats connus. Source : <a href="https://lcp.fr/actualites/presidentielle-2027-la-liste-des-candidats-deja-en-lice-et-des-pretendants-436373" target="_blank" rel="noopener" style="color:var(--pri);text-decoration:underline">LCP</a>.</p>

function sMode(m){mode=m;ans={};dbSet=new Set();detOpen=new Set();showCode=false;ci=0;if(m==='filter'){aQ=QF;}else if(m==='quick'){aQ=Q35;}else{selTh=new Set(TH);aQ=QQ;}R();requestAnimationFrame(()=>{const el=document.getElementById('avant');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});}

function rQuiz(){
  const q=aQ[ci],a=ans[q.id],isFlt=mode==='filter',isLast=ci===aQ.length-1;
  const pct=(isLast&&a!==undefined)?100:Math.round(ci/aQ.length*100);
  const sc=v=>{if(a===v)return v===-2?'sn2':v===-1?'sn1':v===0?'s0':v===1?'s1':'s2';return '';};
  const isDet=detOpen.has(q.id);
  const ce=getElim(),ec=Object.keys(ce).length;
  const elim=getElim();
  const ebar=isFlt&&ec>0?`<div style="background:var(--rg);border:1px solid var(--rb);border-radius:0;padding:10px 13px;margin-bottom:12px;font-size:13px;color:var(--rt);font-weight:500">■ ${ec} candidat${ec>1?'s':''} éliminé${ec>1?'s':''} : ${Object.keys(ce).map(k=>CV[k].s).join(', ')}</div>`:'';
  const fhint=isFlt?`<div style="padding:11px 14px;border-radius:0;background:var(--wg);border:1px solid var(--wb);font-size:13px;color:var(--wt);margin-bottom:12px;line-height:1.6"><b>Filtre Décisif</b> : Répondre <b>"Totalement d'accord"</b> ou <b>"Totalement en désaccord"</b> crée une <b style="color:var(--rt)">ligne rouge automatique</b> : tout candidat en position opposée est éliminé, même à 90 % de compatibilité globale.</div>`:'';
  const notesHtml=q.notes.length?`<div class="fn">${q.notes.map(n=>`<div style="margin-bottom:3px"><sup>${n[0]}</sup> ${n[1]}</div>`).join('')}</div>`:'';
  const detBox=isDet?`<div class="dbox" style="margin-top:12px"><p style="font-size:11px;font-weight:700;color:var(--pri);margin-bottom:8px;text-transform:uppercase;letter-spacing:.07em">Contexte factuel</p><p style="font-size:13.5px;color:var(--t2);line-height:1.75;margin-bottom:13px">${q.ctx}</p><div style="height:1px;background:var(--cb);margin-bottom:13px"></div><p style="font-size:11px;font-weight:700;color:var(--t4);margin-bottom:9px;text-transform:uppercase;letter-spacing:.07em">Arguments</p>${argRow('pour',q.arg1)}${argRow('contre',q.arg2)}<div style="margin-top:12px;padding-top:10px;border-top:.5px solid var(--cb)"><div class="lb" style="margin-bottom:7px">Sources pour approfondir</div><div style="display:flex;flex-wrap:wrap;gap:12px">${q.src.map(s=>`<a class="sa" href="${s.u}" target="_blank">→ ${s.l}</a>`).join('')}</div></div>${notesHtml}</div>`:'';
  const isRL=dbSet.has(q.id);
  const rlb=isRL?`<div style="display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:0;background:var(--rg);border:1px solid var(--rb);font-size:12px;color:var(--rt);font-weight:600;margin-top:8px">■ Ligne rouge active : candidats opposés éliminés</div>`:'';

  const nxt=isLast&&a!==undefined?`<button class="pr" onclick="finish()">Voir les résultats →</button>`:`<span class="bs">${a!==undefined?'Passage auto dans 0,5 s…':''}</span>`;
  const modalHTML=resModal?`<div id="res-modal" style="position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)" onclick="if(event.target.id==='res-modal'){resModal=false;R();}"><div style="background:var(--card);border-radius:0;padding:28px 24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center"><div style="font-size:32px;margin-bottom:12px"></div><div style="font-size:19px;font-weight:700;color:var(--t1);font-family:'Spectral',Georgia,serif;margin-bottom:8px">Test terminé !</div><p style="font-size:14px;color:var(--t3);line-height:1.6;margin-bottom:22px">Vous avez répondu à toutes les questions. Découvrez vos résultats ou revenez à la dernière question.</p><button onclick="finish()" style="display:block;width:100%;padding:13px;background:var(--pri);color:#fff;border:none;border-radius:0;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px;touch-action:manipulation">Voir mes résultats →</button><button onclick="resModal=false;R();" style="display:block;width:100%;padding:11px;background:transparent;color:var(--t3);border:1.5px solid var(--cb);border-radius:0;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation">← Revenir à la dernière question</button></div></div>`:'';

  Z().innerHTML=nav()+simBanner()+`<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><span class="bs" style="font-weight:600;color:var(--pri)">${isFlt?'Filtre Décisif':mode==='quick'?'Test Rapide':'Test Complet'} · Q${ci+1}/${aQ.length}</span><span class="bs">${pct}%</span></div><div class="pb2" style="margin-bottom:14px"><div class="pf" style="width:${pct}%"></div></div>${ebar}<div class="card">${fhint}<span style="display:inline-block;padding:4px 12px;border-radius:0;font-size:12px;font-weight:600;background:var(--priL);color:var(--pri);border:1px solid var(--priB);margin-bottom:13px">${q.th}</span><p class="qt" style="margin-bottom:14px">${q.t}</p><p class="bs" style="margin-bottom:10px;font-weight:500;color:var(--t3)">Sélectionnez une réponse</p><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-bottom:8px">${LK.map(l=>`<button class="ab ${sc(l.v)}" onclick="pick(${l.v})">${l.l.replace('\n','<br>')}</button>`).join('')}</div><button class="ab sk" style="width:100%;margin-bottom:3px" onclick="pickSk()">Je ne connais pas ce sujet</button>${rlb}<div style="margin-top:12px;border-top:.5px solid var(--cb);padding-top:12px"><button class="db${isDet?' on':''}" onclick="tDet(${q.id})">${isDet?'▲ Masquer le contexte':'Contexte, arguments &amp; sources'}</button></div>${detBox}</div>${showCode?`<div style="margin-top:10px">${codeBlock()}</div>`:''}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px"><div style="display:flex;gap:8px"><button class="se" onclick="gBack()">← Question précédente</button><button class="se" style="font-size:12px" onclick="sC()">${showCode?'▲':''} Code</button></div>${nxt}</div></div>${resModal?modalHTML:''}`;}

function tDet(qid){detOpen.has(qid)?detOpen.delete(qid):detOpen.add(qid);R();}
function pick(v){if(tmr){clearTimeout(tmr);tmr=null;}ans[aQ[ci].id]=v;if(mode==='filter'&&(v===2||v===-2))dbSet.add(aQ[ci].id);else if(mode==='filter')dbSet.delete(aQ[ci].id);R();if(document.activeElement)document.activeElement.blur();if(ci<aQ.length-1){tmr=setTimeout(()=>{ci++;R();},500);}else{resModal=true;R();}}
function pickSk(){if(tmr){clearTimeout(tmr);tmr=null;}ans[aQ[ci].id]='skip';R();if(document.activeElement)document.activeElement.blur();if(ci<aQ.length-1){tmr=setTimeout(()=>{ci++;R();},500);}else{resModal=true;R();}}
function gBack(){if(tmr){clearTimeout(tmr);tmr=null;}if(ci>0){ci--;R();}else{ph='home';R();}}
function finish(){ph='results';showCode=false;resModal=false;R();}

function rRes(){
  const res=compute(),td=tend(res.ux,res.uy),elim=getElim();
  const skipped=aQ.filter(q=>ans[q.id]==='skip');
  const thCount=new Set(aQ.map(q=>q.th)).size;
  const sansCnt=aQ.filter(q=>ans[q.id]===0).length;
  const answCnt=aQ.filter(q=>ans[q.id]!==undefined).length;
  const sansRatio=answCnt>0?sansCnt/answCnt:0;
  const sansWarn=sansRatio>0.3?`<div style="background:var(--wg);border:1px solid var(--wb);border-radius:0;padding:14px 16px;margin-bottom:16px"><div style="font-size:14px;font-weight:700;color:var(--wt);margin-bottom:8px">Résultats à interpréter avec précaution</div><p style="font-size:13.5px;line-height:1.7;color:var(--wt);margin-bottom:8px">Vous avez répondu <strong>"Sans opinion"</strong> à <strong>${sansCnt} question${sansCnt>1?'s':''} sur ${answCnt}</strong> (${Math.round(sansRatio*100)}%). Cette valeur est encodée à <code style="background:rgba(0,0,0,.06);padding:1px 5px;border-radius:0">0</code> dans le calcul, ce qui tire les scores de compatibilité vers <strong>50 %</strong> sur ces sujets et atténue les différences entre candidats.</p><p style="font-size:13.5px;line-height:1.7;color:var(--wt)">Pour des résultats plus discriminants, relancez le test en utilisant <strong>Je ne connais pas ce sujet</strong> (skip) sur les questions que vous ne maîtrisez pas : ces questions seront exclues du calcul plutôt que neutralisées à 50 %.</p></div>`:'';

  const candsH=res.sorted.map(([k,p],i)=>{
    const nRep=aQ.filter(q=>ans[q.id]!==undefined&&ans[q.id]!=='skip').length,isE=!!elim[k],isTop=i===0&&!isE,isPx=isE&&p!==null&&p>=65;
    const{ag,di}=getDet(k);const conflicts=elim[k]||[];
    const pill=(label,col)=>`<span style="display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 9px;border-radius:0;border:1px solid ${col}22;background:${col}11;color:${col};white-space:nowrap">${label}</span>`;
    const agRow=o=>`<div style="display:flex;gap:0;margin-bottom:5px;border-radius:0;overflow:hidden;border:.5px solid #DDEAE2;background:${dk?'rgba(34,197,94,.06)':'#EEF3EF'}"><div style="width:3px;background:#22c55e;flex-shrink:0"></div><div style="padding:7px 10px;flex:1"><div style="font-size:12.5px;color:var(--t1);line-height:1.4;margin-bottom:5px">✓ ${o.t}</div><div style="display:flex;gap:5px;flex-wrap:wrap"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:0;background:rgba(34,197,94,.15);color:#2F6B4F;border:.5px solid #DDEAE2">Vous : ${o.uv}</span><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:0;background:rgba(34,197,94,.10);color:#2F6B4F;border:.5px solid #DDEAE2">Candidat : ${o.cp}</span>${srcLink(k,o.id)}</div></div></div>`;
    const diRow=o=>`<div style="display:flex;gap:0;margin-bottom:5px;border-radius:0;overflow:hidden;border:.5px solid #E3C6BD;background:${dk?'rgba(239,68,68,.06)':'#F7EFEC'}"><div style="width:3px;background:#A03A28;flex-shrink:0"></div><div style="padding:7px 10px;flex:1"><div style="font-size:12.5px;color:var(--t1);line-height:1.4;margin-bottom:5px">✗ ${o.t}</div><div style="display:flex;gap:5px;flex-wrap:wrap"><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:0;background:rgba(239,68,68,.15);color:#A03A28;border:.5px solid #E3C6BD">Vous : ${o.uv}</span><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:0;background:rgba(100,116,139,.12);color:var(--t3);border:.5px solid var(--cb)">Candidat : ${o.cp}</span>${srcLink(k,o.id)}</div></div></div>`;
    const tot=ag.length+di.length;
    const agPct=tot>0?Math.round(ag.length/tot*100):50;
    const summaryBar=tot>0?`<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:5px"><span style="color:#2F6B4F">✓ ${ag.length} accord${ag.length>1?'s':''}</span><span style="color:#A03A28">${di.length} désaccord${di.length>1?'s':''} ✗</span></div><div style="height:7px;border-radius:0;overflow:hidden;background:var(--cb)"><div style="height:100%;width:${agPct}%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:0;transition:width .4s"></div></div></div>`:'';
    const agH=ag.length?`<div style="margin-bottom:4px">${ag.map(agRow).join('')}</div>`:`<div style="font-size:13px;color:var(--t4);padding:6px 0">Aucun accord notable</div>`;
    const diH=di.length?`<div style="margin-bottom:4px">${di.map(diRow).join('')}</div>`:`<div style="font-size:13px;color:var(--t4);padding:6px 0">Aucun désaccord notable</div>`;
    const conflH=conflicts.length?`<div style="background:var(--rg);border:1px solid var(--rb);border-radius:0;padding:12px;margin-bottom:12px"><div style="font-size:13px;font-weight:700;color:var(--rt);margin-bottom:7px">■ Raison${conflicts.length>1?'s':''} d'élimination</div>${conflicts.map(t=>`<div style="font-size:13px;color:var(--rt);line-height:1.6;padding:5px 0;border-bottom:.5px solid var(--rb)">· ${t}</div>`).join('')}</div>`:'';
    const pxH=isPx?`<div style="background:var(--wg);border:1px solid var(--wb);border-radius:0;padding:14px;margin-bottom:12px"><div style="font-size:13px;font-weight:700;color:var(--wt);margin-bottom:8px">Paradoxe détecté</div><p style="font-size:14px;color:var(--wt);line-height:1.65;margin-bottom:8px"><b>${CV[k].n}</b> est éliminé sur votre ligne rouge, mais affiche <b>${p}% de compatibilité</b> sur les ${res.nd[k]} positions documentées comparées à vos réponses.</p><p style="font-size:13px;color:var(--wt);line-height:1.65">Ce score est calculé sur la totalité du programme. Le désaccord identifié est-il vraiment rédhibitoire ?</p></div>`:'';
    return`<div class="cr${isE?' el':''}${isTop?' tp':''}"><div class="ch2" onclick="tCand('${k}')"><div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="width:10px;height:10px;border-radius:50%;background:${CV[k].c};display:inline-block;flex-shrink:0;box-shadow:0 0 0 2px ${CV[k].c}22"></span><span style="font-size:15px;font-weight:${isTop?700:500};color:var(--t1);white-space:nowrap">${CV[k].n}</span><span class="bs" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${CV[k].p}</span>${isE?`<span style="font-size:11px;background:var(--rg);color:var(--rt);padding:2px 7px;border-radius:0;flex-shrink:0;font-weight:700;border:.5px solid var(--rb)">éliminé</span>`:''}${isPx?`<span style="font-size:11px;background:var(--wg);color:var(--wt);padding:2px 7px;border-radius:0;flex-shrink:0;border:.5px solid var(--wb)">paradoxe</span>`:''}</div><div style="display:flex;align-items:center;gap:5px;flex-shrink:0"><span style="font-size:16px;font-weight:700;color:${isTop?CV[k].c:'var(--t4)'}">${p===null?'n/d':p+'%'}</span><span id="arr-${k}" style="font-size:11px;color:var(--t4)">▼</span></div></div><div class="bar" style="margin:0 13px 9px"><div class="bf" data-w="${p===null?0:p}" style="background:${CV[k].c};opacity:${isE?.25:isTop?1:.7}"></div></div><div id="det-${k}" class="cd">${conflH}${pxH}<div class="bs" style="margin-bottom:10px">Positions documentées comparées à vos réponses : <b>${res.nd[k]}</b> sur ${nRep}. Une position non documentée est exclue du calcul.</div>${summaryBar}<div class="lb" style="margin-bottom:5px">✓ Accords (${ag.length})</div>${agH}<div class="lb" style="margin:10px 0 5px">✗ Désaccords (${di.length})</div>${diH}</div></div>`;
  }).join('');
  const skipSec=skipped.length?`<div style="margin-top:22px"><div style="font-size:15px;font-weight:700;color:var(--t1);margin-bottom:6px">Sujets non répondus : sources pour se renseigner</div><p class="bs" style="margin-bottom:12px">${skipped.length} sujet${skipped.length>1?'s':''} passé${skipped.length>1?'s':''}.</p>${skipped.map(q=>{const nn=q.notes.length?`<div class="fn" style="margin-top:8px">${q.notes.map(n=>`<div><sup>${n[0]}</sup> ${n[1]}</div>`).join('')}</div>`:'';return`<div style="background:var(--priL);border:1px solid var(--priB);border-radius:0;padding:13px;margin-bottom:9px"><div style="font-size:14px;font-weight:600;color:var(--t1);margin-bottom:6px">${q.th} : ${q.t}</div><p style="font-size:13px;color:var(--t2);line-height:1.65;margin-bottom:10px">${q.ctx}</p>${argRow('pour',q.arg1)}${argRow('contre',q.arg2)}${nn}<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:10px">${q.src.map(s=>`<a class="sa" href="${s.u}" target="_blank">→ ${s.l}</a>`).join('')}</div></div>`;}).join('')}</div>`:'';
  const srcMap={};aQ.forEach(q=>{if(!srcMap[q.th])srcMap[q.th]={th:q.th,src:q.src};});
  const srcH=Object.values(srcMap).map(({th,src})=>`<div style="margin-bottom:11px"><p class="bs" style="font-weight:600;margin-bottom:5px">${th}</p>${src.map(s=>`<a class="sa" href="${s.u}" target="_blank" style="margin-right:14px">→ ${s.l}</a>`).join('')}</div>`).join('');
  Z().innerHTML=nav()+simBanner()+`<div><div class="lb" style="margin-bottom:12px">Résultats · ${mode==='quick'?'Test Rapide':mode==='deep'?'Test Complet':'Filtre Décisif'}</div><div class="sc"><div class="lb" style="margin-bottom:6px">Votre tendance politique</div><div style="font-size:24px;font-weight:700;margin-bottom:9px;color:var(--t1);font-family:'Spectral',Georgia,serif">${td.l}</div><p class="bm">${td.d}</p>${skipped.length?`<p class="bs" style="margin-top:7px">${skipped.length} sujet${skipped.length>1?'s':''} passé${skipped.length>1?'s':''} : exclus du calcul</p>`:''}</div>`+sansWarn+`<div class="card" style="padding:15px;margin-bottom:15px"><div style="font-size:15px;font-weight:700;margin-bottom:10px;color:var(--t1)">Boussole politique</div>${compass(res.ux,res.uy)}<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:10px">${CK.map(k=>`<div style="display:flex;align-items:center;gap:5px;overflow:hidden"><span style="width:7px;height:7px;border-radius:50%;background:${CV[k].c};flex-shrink:0;display:inline-block"></span><span class="bs" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${CV[k].s}</span></div>`).join('')}</div></div><div style="background:var(--card);border:.5px solid var(--cb);border-radius:0;padding:18px 20px;margin-bottom:15px;box-shadow:var(--card-shadow)"><div style="font-size:15px;font-weight:700;color:var(--t1);margin-bottom:14px">Avant de conclure : une mise en perspective</div><p style="font-size:13.5px;line-height:1.75;color:var(--t2);margin-bottom:10px;text-align:justify">Ce test vous indique avec quel candidat vos opinions programmatiques sont les plus proches. Mais voter pour un candidat, c'est voter pour <strong>l'intégralité de son programme</strong> : pas seulement pour les points sur lesquels vous êtes d'accord.</p><p style="font-size:13.5px;line-height:1.75;color:var(--t2);margin-bottom:10px;text-align:justify">Un candidat qui correspond à votre conviction la plus forte peut simultanément défendre des positions que vous désapprouvez sur d'autres. Le score affiché en tient compte, mais c'est vous qui décidez du poids accordé à chaque enjeu.</p><p style="font-size:13.5px;line-height:1.75;color:var(--t2);margin-bottom:10px;text-align:justify"><strong>Le candidat parfait n'existe certainement pas.</strong> Voter, c'est presque toujours accepter des concessions. La vraie question n'est pas «&nbsp;quel candidat correspond à 100&nbsp;% de mes positions&nbsp;?&nbsp;» (cette personne n'existe pas), mais «&nbsp;sur quels enjeux suis-je prêt à faire des concessions, et sur lesquels est-ce absolument impossible&nbsp;?&nbsp;»</p><p style="font-size:13.5px;line-height:1.75;color:var(--t2);margin-bottom:16px;text-align:justify">Ce test vous donne des éléments. La réflexion finale vous appartient.</p><div style="height:1px;background:var(--cb);margin-bottom:14px"></div><div style="background:var(--priL);border:1px solid var(--priB);border-radius:0;padding:14px 16px;margin-bottom:0"><div style="font-size:13px;font-weight:700;color:var(--pri);margin-bottom:9px">Le biais du vote utile</div><p style="font-size:13.5px;line-height:1.75;color:var(--t2);margin-bottom:12px;text-align:justify">Écarter un candidat parce qu'on le juge <em>«&nbsp;pas assez populaire pour gagner&nbsp;»</em>, c'est laisser les sondages décider à votre place avant même l'élection. C'est un biais documenté&nbsp;: en renonçant à votre préférence réelle, vous contribuez précisément au résultat que vous redoutiez, et vous privez ce candidat d'un signal politique réel sur son score.</p><button onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.textContent=this.nextElementSibling.style.display==='none'?'▸ Plus de détail':'▴ Réduire';" style="background:transparent;border:1px solid var(--priB);border-radius:0;padding:5px 12px;font-size:12px;color:var(--pri);cursor:pointer;font-family:inherit;font-weight:600;touch-action:manipulation;-webkit-tap-highlight-color:transparent">▸ Plus de détail</button><div style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--priB)"><p style="font-size:13.5px;line-height:1.75;color:var(--t2);margin-bottom:10px;text-align:justify">Il existe un biais bien documenté en psychologie électorale&nbsp;: <strong>le vote utile</strong>. Convaincu qu'un candidat ne sera pas élu, un électeur se résout à ne pas voter pour lui, et choisit à la place le «&nbsp;moins mauvais&nbsp;» parmi ceux qu'il juge capables de gagner. Ce raisonnement, répété à grande échelle, devient une <strong>prophétie auto-réalisatrice</strong>&nbsp;: le candidat ne progresse pas parce que ses sympathisants ne votent pas pour lui, et ils ne votent pas pour lui parce qu'il ne progresse pas.</p><p style="font-size:13.5px;line-height:1.75;color:var(--t2);margin-bottom:10px;text-align:justify">Voter pour le candidat qui correspond le mieux à vos valeurs, c'est envoyer un signal réel sur ce que vous attendez de la politique. Un score élevé au premier tour influence les équilibres politiques à long terme, même sans victoire immédiate.</p><p style="font-size:13.5px;line-height:1.75;color:var(--t2);margin:0;text-align:justify">Ce test vous a montré vos compatibilités. La décision vous appartient, mais elle devrait partir de vos convictions, pas de la peur du résultat.</p></div></div></div><div style="font-size:15px;font-weight:700;margin-bottom:6px;color:var(--t1)">Compatibilité par candidat</div><p class="bs" style="margin-bottom:10px">Cliquez pour voir accords, désaccords, lignes rouges et paradoxes.</p>${candsH}${skipSec}<div class="card" style="margin-top:16px;padding:15px"><div style="font-size:15px;font-weight:700;color:var(--t1);margin-bottom:12px">Sources par thème</div>${srcH}</div><div style="margin-top:14px;padding:14px;background:var(--priL);border:1px solid var(--priB);border-radius:0"><p class="bs" style="line-height:1.7;color:var(--t2)"><b>Méthodologie</b> : ${aQ.length} questions / ${thCount} thèmes. Compatibilité = 1 − |vote − position_candidat| / 4. Ligne rouge (Filtre Décisif) : élimine si signe opposé à un vote "totalement". Positions estimées sur programmes officiels 2027 (provisoires : en cours). Projet indépendant, aucune orientation d'opinion. Chaque chiffre cité dans les contextes est sourcé par une référence officielle. Positions candidats : simulation provisoire à 0 : non représentative. Retailleau : estimations basées sur prises de position publiques 2024-2026 (Ministre de l'Intérieur, déclarations publiques, votes au Sénat). Bardella : positions alignées sur le programme RN 2022, avec position neutre sur l'âge légal de départ à la retraite (déclarations ambiguës 2026). Glucksmann : estimations basées sur programme Place Publique/PS, déclarations publiques 2024-2026, positions au Parlement européen.</p></div><div style="margin-top:15px;display:flex;gap:10px;flex-wrap:wrap"><button class="se" onclick="sC()">${showCode?'▲ Masquer':'Algorithme'}</button><a href="https://github.com/pourlafrance/Test-de-personnalite-politique" target="_blank" class="se" style="text-decoration:none">↗ Code source</a><button class="se" onclick="gH()">↩ Recommencer</button></div>${showCode?`<div style="margin-top:14px">${codeBlock()}</div>`:''}</div>`
  +civic();
  setTimeout(()=>{document.querySelectorAll('.bf').forEach(e=>{e.style.width=e.dataset.w+'%';});},100);}
function tCand(k){const e=document.getElementById('det-'+k),a=document.getElementById('arr-'+k);if(e){e.classList.toggle('op');if(a)a.textContent=e.classList.contains('op')?'▲':'▼';}}
R();
</script>
